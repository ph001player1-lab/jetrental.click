# ============================================================================
# KOKON — сервисы на сервере
# ============================================================================
#   caddy — HTTPS для bot / staff / сайтов; отдаёт файлы из папки web/
#           и проксирует страницы, API и вебхуки в bot
#   bot   — наш Node.js-сервер (папка server/)
#
# Секреты (токены, ключи) — только в /opt/kokon/.env на сервере, НЕ в git.
# Запуск и обновление: bash /opt/kokon/app/deploy/update.sh
# ============================================================================

name: kokon

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Конфиг берём из папки deploy целиком: так после git pull Caddy видит
    # новый Caddyfile (update.sh делает caddy reload)
    command: caddy run --config /etc/caddy/kokon/Caddyfile --adapter caddyfile
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:-bot.jetrental.click}
      STAFF_DOMAIN: ${STAFF_DOMAIN:-staff.jetrental.click}
      SITE_DOMAIN: ${SITE_DOMAIN:-jetrental.click}
      KOKON_PREVIEW_DOMAIN: ${KOKON_PREVIEW_DOMAIN:-kokon.jetrental.click}
    volumes:
      - ./:/etc/caddy/kokon:ro
      - ../web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

  bot:
    build: ../server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # Страницы сайта собирает бот: тексты (i18n.js) и версии файлов — отсюда
      SITE_DIR: /srv/web/site
    volumes:
      - bot_data:/data
      - ../web:/srv/web:ro
      # Ключ служебного аккаунта Google (доступ к таблице). Файл кладётся на
      # сервер вручную через scp; если его нет, запуск остановится с ошибкой.
      - type: bind
        source: /opt/kokon/google-sa.json
        target: /run/secrets/google-sa.json
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - path: /opt/kokon/.env
        required: false

volumes:
  caddy_data:
  caddy_config:
  bot_data:
