# ============================================================================
# KOKON — сервисы на сервере
# ============================================================================
#   caddy — HTTPS для bot / staff / сайтов; отдаёт файлы из папки web/
#           и проксирует страницы, API и вебхуки в bot
#   bot   — наш Node.js-сервер (папка server/)
#   observer — наблюдатель рабочей группы WhatsApp (папка observer/)
#
# Секреты (токены, ключи) — только в /opt/kokon/.env на сервере, НЕ в git.
# Запуск и обновление: bash /opt/kokon/app/deploy/update.sh
# ============================================================================

name: kokon

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Конфиг берём из папки deploy целиком: так после git pull Caddy видит
    # новый Caddyfile (update.sh делает caddy reload)
    command: caddy run --config /etc/caddy/kokon/Caddyfile --adapter caddyfile
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:-bot.jetrental.click}
      STAFF_DOMAIN: ${STAFF_DOMAIN:-staff.jetrental.click}
      SITE_DOMAIN: ${SITE_DOMAIN:-jetrental.click}
      KOKON_PREVIEW_DOMAIN: ${KOKON_PREVIEW_DOMAIN:-kokon.jetrental.click}
    volumes:
      - ./:/etc/caddy/kokon:ro
      - ../web:/srv/web:ro
      # Фото, загруженные через сайт сотрудников (пишет bot, отдаёт caddy)
      - site_uploads:/srv/uploads:ro
      # Журнал запросов (JSON): по нему бот считает, на что ушёл трафик
      - caddy_logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

  bot:
    build: ../server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # Страницы сайта собирает бот: тексты (i18n.js) и версии файлов — отсюда
      SITE_DIR: /srv/web/site
      UPLOADS_DIR: /uploads
      # Версия кода для вкладки «Сервер» — задаёт update.sh
      APP_VERSION: ${APP_VERSION:-dev}
      APP_VERSION_DATE: ${APP_VERSION_DATE:-}
    volumes:
      - bot_data:/data
      - site_uploads:/uploads
      - ../web:/srv/web:ro
      # Вкладка «Сервер»: счётчик трафика vnStat на самом сервере, журнал
      # Caddy и имя сервера — только чтение
      - /var/lib/vnstat:/host/vnstat:ro
      - caddy_logs:/caddy-logs:ro
      - /etc/hostname:/host/hostname:ro
      # Ключ служебного аккаунта Google (доступ к таблице). Файл кладётся на
      # сервер вручную через scp; если его нет, запуск остановится с ошибкой.
      - type: bind
        source: /opt/kokon/google-sa.json
        target: /run/secrets/google-sa.json
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - path: /opt/kokon/.env
        required: false

  # Наблюдатель рабочей группы WhatsApp (только чтение, observer/). Отдельный
  # контейнер без доступа к секретам бота: получает только общий секрет для
  # связи с ботом. Портов наружу нет — бот и наблюдатель общаются внутри Docker.
  observer:
    build: ../observer
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      BOT_INTERNAL_URL: http://bot:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
    volumes:
      - observer_data:/data
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  bot_data:
  site_uploads:
  observer_data:
